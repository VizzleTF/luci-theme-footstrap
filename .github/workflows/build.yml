# luci-theme-footstrap is noarch: one build, two containers (apk for 25.12+, ipk for
# 24.10), both out of owfeed rather than an OpenWrt SDK. docs/conventions.md has why.
#
# The release pipeline itself is not here — it is owfeed's `package.yml`, which every
# repository in this ecosystem shares. What is here is this theme's own gates: each
# one line, each a script under tools/ whose header says what it is for and what
# shipped once because it did not exist.

name: Build LuCI theme packages

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh tools/check-shell.sh
      - run: sh tools/scan-marker.sh
      - run: sh tools/check-acl.sh
      - run: luci-theme-footstrap/build-css.sh /tmp/cascade.css
      - run: python3 tools/audit.py --strict
      # gettext for update-po; the ucode gate needs only docker, which the runner has.
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: luci-theme-footstrap/update-po.sh --check

  # npm-based gates, and they live here and nowhere else: the OpenWrt buildbot has no
  # node, luci.mk never needs one, and nothing in package.json is shipped.
  lint:
    name: Lint + accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Through package.json, not a second copy of the globs: a glob restated here
      # goes on linting the old path after package.json moves.
      - run: npm run lint:js
      - run: npm run lint:css

      - run: npx playwright install --with-deps chromium
      - run: node tools/a11y-gallery.mjs
      - run: node tools/export-tier.mjs
      - run: node tools/css-metrics.mjs
      - run: node tools/fs-orphans.mjs
      - run: node tools/css-dup.mjs
      - run: node tools/css-i18n.mjs
      - run: node tools/mirror.mjs
      - run: node tools/axes.mjs
      - run: node tools/chrome-fence.mjs

      # jsmin-verify finds the shipped JS itself; JSMIN names the binary to test.
      - run: echo "JSMIN=$(sh tools/build-jsmin.sh)" >> "$GITHUB_ENV"
      - run: node tools/jsmin-verify.mjs

  # No key anywhere in this job. `owfeed check` is build, sign, index and doctor on
  # keys owfeed generates and throws away, so a pull request exercises the pipeline
  # that publishes rather than a second one that drifts from it.
  build:
    name: Build the packages
    needs: [check, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      # --ignore-scripts: a dev dependency's lifecycle script has no business running
      # in the job that produces the released bytes.
      - run: npm ci --ignore-scripts

      - uses: owfeed/owfeed/setup@v0.5.0
        with:
          version: v0.5.0

      # The commit's timestamp, not the job's: a package's identity is a hash over its
      # payload and mkpkg records mtimes, so re-running a release over the same commit
      # has to produce the same bytes.
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - run: ./tools/stage.sh
      - run: owfeed plan
      - run: owfeed check
      - run: owfeed build
      - run: sh tools/check-packages.sh

      # dist/root and dist/scripts are staging, not output.
      - uses: actions/upload-artifact@v7
        with:
          name: owfeed-packages
          path: |
            dist/noarch
            dist/all
          if-no-files-found: error

  # Everything above proves the package was BUILT correctly. None of it proves the
  # thing a user cares about: that installing it produces a router whose pages render.
  # owlab boots a real OpenWrt, installs the package and logs into LuCI to fetch the
  # theme's own pages — an unauthenticated request is a redirect to the login form,
  # which is why a hand-written curl reports 403 on a healthy page.
  #
  # No key exists anywhere in this job: it asserts that a package works, never that
  # anyone should trust it.
  verify:
    name: The package works on a real router
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: owfeed-packages
          path: dist/

      # ONE RELEASE PER STEP: 25.12 is apk and 24.10 is opkg, and neither will install
      # the other's file.
      - name: Install this build on 25.12 and render its pages
        uses: owfeed/owlab/action@v0.5.3
        with:
          version: v0.5.3
          releases: "25.12.4"
          install: dist/noarch/luci-theme-footstrap-*.apk
          # `exec ucode -T -c` is LuCI's own trycompile, run against the templates as
          # INSTALLED and with the router's real luci.core and uci — so it needs no
          # stubs and no interpreter of ours. It replaces a gate that cloned ucode at a
          # pinned commit and built it with cmake, which ran in CI and nowhere else.
          # A stray brace here is the one way this repository can ship a completely
          # broken UI with everything else green: LuCI falls back to another theme and
          # says nothing.
          assert: |
            package luci-theme-footstrap
            file /www/luci-static/footstrap/cascade.css
            http 200 /cgi-bin/luci/admin/status/overview
            http 200 /cgi-bin/luci/admin/system/system
            exec for f in /usr/share/ucode/luci/template/themes/footstrap/*.ut; do ucode -T -c -o /dev/null "$f" || exit 1; done

      - name: Install this build on 24.10 and render its pages
        uses: owfeed/owlab/action@v0.5.3
        with:
          version: v0.5.3
          releases: "24.10.8"
          install: dist/all/luci-theme-footstrap_*.ipk
          # The same compile as the 25.12 leg, and not redundant: the templates are
          # identical but the interpreters are not, and a construct 25.12's ucode
          # accepts is not proof that 24.10's does.
          assert: |
            package luci-theme-footstrap
            file /www/luci-static/footstrap/cascade.css
            http 200 /cgi-bin/luci/admin/status/overview
            http 200 /cgi-bin/luci/admin/system/system
            exec for f in /usr/share/ucode/luci/template/themes/footstrap/*.ut; do ucode -T -c -o /dev/null "$f" || exit 1; done

      # And the published channel, by NAME, out of the signed index — a different
      # claim entirely: it proves the index parses, the URL does not redirect
      # somewhere apk will not follow, and the key on the router matches the one that
      # signed it.
      #
      # It tests what is ALREADY LIVE rather than this build, so it never fails the
      # job: a feed mid-DNS-migration would otherwise block a theme release on the
      # health of a channel this repository does not own.
      - id: feed-key
        if: github.event_name != 'pull_request'
        run: sh tools/feed-key.sh

      - name: Assert the feed serves a working theme
        if: github.event_name != 'pull_request' && steps.feed-key.outputs.reachable == 'true'
        continue-on-error: true
        uses: owfeed/owlab/action@v0.5.3
        with:
          version: v0.5.3
          releases: "25.12.4"
          feed: https://repo.owfeed.org/releases/25.12/x86_64/packages.adb
          feed-key: ${{ runner.temp }}/owfeed-packages.pem
          feed-name: owfeed-packages
          install: luci-theme-footstrap
          assert: |
            package luci-theme-footstrap
            http 200 /cgi-bin/luci/admin/status/overview

  # The only job that holds a key, and `needs: [build, verify]` is what keeps a tag
  # from publishing a package no router has installed.
  release:
    name: Sign and publish
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: owfeed/owfeed/.github/workflows/package.yml@v0.5.0
    secrets:
      # The repository already has this key, and owfeed-packages pins its public half.
      sign-key: ${{ secrets.OWFEED_AUTHOR_KEY }}
      usign-key: ${{ secrets.FOOTSTRAP_USIGN_KEY }}
    with:
      owfeed-version: v0.5.0
      # Writes dist/notes.md and dist/install.sh. Both are assets as well as
      # documentation: the theme's confirm dialog reads the notes from the release
      # rather than from the API, and the installer is served from the release CDN
      # because raw.githubusercontent is rate-limited for the very user who most
      # needs it (issue #17).
      pre-release: sh tools/stage-release.sh
      sign-also: install.sh
      notes-file: dist/notes.md
      verify-with: release.pub

  # Refresh the Pages mirror of the release metadata. Called rather than triggered:
  # `on: release` never fires for a release created with GITHUB_TOKEN.
  pages:
    name: Refresh the Pages mirror
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
